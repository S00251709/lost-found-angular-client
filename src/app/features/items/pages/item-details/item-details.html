<h2>Item Details</h2>

@if (item(); as itemData){
    <article>
        <h3>{{ itemData.name }}</h3>
        <p>{{ itemData.description }}</p>
        <p><strong>Type:</strong> {{ itemData.type }}</p>
        <p><strong>Category:</strong> {{ itemData.category }}</p>
        <p><strong>Location:</strong> {{ itemData.location }}</p>
        <p><strong>Status</strong> {{ itemData.status }}</p>

        <div class="button-group">
            <a
                matButton="filled"
                [routerLink]="['/items', itemData._id, 'edit']"
            >
                Edit
            </a>

            <button
                matButton
                type="button"
                (click)="deleteItem(itemData)"
            >
                Delete
            </button>
            </div>
    </article>
} @else {
    <p>Loading item</p>
}
